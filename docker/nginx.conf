server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        # The SPA shell itself always revalidates: hashed asset names change
        # between builds and a stale index.html references 404 bundles.
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Static assets always revalidate: heuristic caching made stale CSS/Math
    # copies survive rebuilds because identical-looking 304s kept browser
    # cache entries alive. No-new-deps fix, keeps the security headers above.
    location ~* \.(?:css|js|png|jpe?g|svg|ico|woff2?)$ {
        expires -1;
        gzip off;
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass http://api:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }


    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
