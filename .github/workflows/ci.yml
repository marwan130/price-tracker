name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and build .NET solution
        run: |
          dotnet restore backend/PriceTracker.slnx
          dotnet build backend/PriceTracker.slnx --no-restore --configuration Release

      - name: Run .NET unit and PostgreSQL integration tests
        run: dotnet test backend/PriceTracker.Tests/PriceTracker.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

      - name: Check frontend dependency advisories
        run: npm --prefix frontend audit --audit-level=high

      - name: Test Scrapling worker
        run: |
          python -m pip install --requirement scraper/requirements.txt pytest
          python -m pytest scraper/tests -q

      - name: Check .NET dependency advisories
        run: dotnet list backend/PriceTracker.slnx package --vulnerable --include-transitive

      - name: Validate Compose configuration
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config --quiet

      - name: Build service images
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml build
