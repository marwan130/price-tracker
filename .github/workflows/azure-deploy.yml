name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend
  SCRAPER_IMAGE_NAME: ghcr.io/${{ github.repository }}-scraper
  RESOURCE_GROUP: price-tracker-rg
  CONTAINER_APP_ENV: price-tracker-env

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.API_URL }}

      - name: Build and push scraper
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.scraper
          push: true
          tags: ${{ env.SCRAPER_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name price-tracker-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

            az containerapp update \
              --name price-tracker-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
              --set-env-vars \
                "ConnectionStrings__Default=${{ secrets.DB_CONNECTION_STRING }}" \
                "Jwt__Secret=${{ secrets.JWT_SECRET }}" \
                "InternalApi__Key=${{ secrets.INTERNAL_API_KEY }}" \
                "Hangfire__DashboardApiKey=${{ secrets.HANGFIRE_KEY }}" \
                "Smtp__Username=${{ secrets.SMTP_USERNAME }}" \
                "Smtp__Password=${{ secrets.SMTP_PASSWORD }}" \
                "Smtp__From=${{ secrets.SMTP_FROM }}" \
                "Frontend__BaseUrl=https://price-tracker-web.graywater-b13edf19.eastus.azurecontainerapps.io" \
                "AllowedHosts=*" \
                "Cors__AllowedOrigins=https://price-tracker-web.graywater-b13edf19.eastus.azurecontainerapps.io"

      - name: Deploy Frontend to Azure Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name price-tracker-web \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

            az containerapp update \
              --name price-tracker-web \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Scraper to Azure Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name price-tracker-scraper \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

            az containerapp update \
              --name price-tracker-scraper \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.SCRAPER_IMAGE_NAME }}:${{ github.sha }} \
              --set-env-vars \
                "ConnectionStrings__Default=${{ secrets.DB_CONNECTION_STRING }}" \
                "Api__InternalKey=${{ secrets.INTERNAL_API_KEY }}" \
                "Api__BaseUrl=${{ secrets.API_URL }}"
